[tool.poetry]
name = "deskforge-api"
version = "1.0.0"
description = "DeskForge - AI Internal Tools Generator Backend"
authors = ["DeskForge Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
bcrypt = "^4.1.3"
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"
redis = {extras = ["hiredis"], version = "^5.0.0"}
pandas = "^2.2.0"
openpyxl = "^3.1.0"
stripe = "^9.5.0"
cryptography = "^42.0.0"
httpx = "^0.27.0"
sse-starlette = "^2.1.0"
python-dateutil = "^2.9.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
faker = "^25.0.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
